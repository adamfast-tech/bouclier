<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18111E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bouclier">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Bouclier</title>
<meta name="description" content="Suivi des injections de Xolair : prochaine piqûre, historique, rotation des sites, badges.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#FBF4EF; --bg-2:#F6E9E2; --surface:#FFFFFF; --surface-2:#FBF0EA; --ink:#2B1D30; --muted:#7C6879; --line:#EEDDD5;
  --coral:#EC6A50; --rose:#D9487A; --plum:#5E3A78; --gold:#D79B2E; --mint:#2E8C69; --mint-soft:#DFF2EA; --warn:#B4542E; --warn-soft:#FBE3D8;
  --grad:linear-gradient(135deg,#F27F5B 0%,#E2537A 55%,#8C4E9E 100%);
  --shadow:0 10px 30px -12px rgba(94,58,120,.28),0 2px 6px rgba(94,58,120,.06);
  --r:22px; --font:"Nunito",ui-rounded,-apple-system,system-ui,sans-serif; --display:"Fraunces",Georgia,serif;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18111E; --bg-2:#21172A; --surface:#261B30; --surface-2:#2F223B; --ink:#F7EEF4; --muted:#BBA7B8; --line:#3A2C47;
  --coral:#FF8B6E; --rose:#F06A97; --plum:#C9A2E6; --gold:#F0BC5A; --mint:#5CCB9E; --mint-soft:#1F3A30; --warn:#FF9B73; --warn-soft:#3D241C;
  --shadow:0 12px 30px -14px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.2);
}}
:root[data-theme="dark"]{
  --bg:#18111E; --bg-2:#21172A; --surface:#261B30; --surface-2:#2F223B; --ink:#F7EEF4; --muted:#BBA7B8; --line:#3A2C47;
  --coral:#FF8B6E; --rose:#F06A97; --plum:#C9A2E6; --gold:#F0BC5A; --mint:#5CCB9E; --mint-soft:#1F3A30; --warn:#FF9B73; --warn-soft:#3D241C;
  --shadow:0 12px 30px -14px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.15}
.blob{position:fixed;z-index:0;border-radius:50%;filter:blur(60px);opacity:.45;pointer-events:none;animation:float 18s ease-in-out infinite alternate}
.blob.b1{width:320px;height:320px;background:#F7A27F;top:-120px;right:-100px}
.blob.b2{width:280px;height:280px;background:#E7799E;bottom:10%;left:-140px;animation-delay:-6s}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .blob{opacity:.18}}
@keyframes float{to{transform:translate(30px,40px) scale(1.1)}}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.hello small{display:block;color:var(--muted);font-weight:700;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase}
.hello h1{font-size:1.75rem}
.who{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-weight:700;font-size:.85rem;box-shadow:var(--shadow);max-width:48%}
.who select{border:0;background:transparent;font-weight:800;appearance:none;-webkit-appearance:none;max-width:120px;text-overflow:ellipsis}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:1.15rem;margin-bottom:10px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.view{animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{opacity:0;animation:viewIn .5s cubic-bezier(.2,.8,.2,1) forwards}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.08s}.stagger>*:nth-child(3){animation-delay:.14s}.stagger>*:nth-child(4){animation-delay:.2s}.stagger>*:nth-child(5){animation-delay:.26s}.stagger>*:nth-child(6){animation-delay:.32s}.stagger>*:nth-child(n+7){animation-delay:.38s}

/* Héros : anneau du compte à rebours */
.hero{position:relative;overflow:hidden;text-align:center;padding:26px 18px 22px;background:var(--surface)}
.hero::before{content:"";position:absolute;inset:-40% -20% auto;height:70%;background:var(--grad);opacity:.12;filter:blur(30px)}
.ring{position:relative;width:228px;height:228px;margin:0 auto 6px}
.ring>svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-2)}
.ring .prog{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num{font-family:var(--display);font-weight:800;font-size:4.2rem;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ring .unit{font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;margin-top:4px}
.ring .pulse{position:absolute;inset:18px;border-radius:50%;box-shadow:0 0 0 0 rgba(226,83,122,.35);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 22px rgba(226,83,122,0)}100%{box-shadow:0 0 0 0 rgba(226,83,122,0)}}
.hero .when{font-weight:800;font-size:1.05rem}
.hero .sub{color:var(--muted);font-size:.92rem;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-weight:800;font-size:.78rem;background:var(--surface-2);color:var(--ink)}
.pill.ok{background:var(--mint-soft);color:var(--mint)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:18px;font-weight:800;font-size:1.02rem;transition:transform .15s,box-shadow .2s,opacity .2s;user-select:none}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 12px 26px -10px rgba(226,83,122,.7);width:100%;position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.btn.ghost{background:var(--surface-2);color:var(--ink);width:100%}
.btn.small{min-height:40px;padding:0 14px;font-size:.9rem;border-radius:14px}
.btn.danger{background:var(--warn-soft);color:var(--warn);width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:grid;gap:10px;margin-top:14px}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1.1}
.stat span{color:var(--muted);font-weight:700;font-size:.82rem}
.stat.accent b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Historique */
.month{font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.78rem;margin:18px 4px 8px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.entry{position:relative;display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .15s}
.entry:active{transform:scale(.98)}
.entry::before{content:"";position:absolute;left:-22px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 4px var(--bg)}
.entry.missed{background:transparent;border-style:dashed;box-shadow:none}
.entry.missed::before{background:var(--line)}
.entry .t{font-weight:800}
.entry .m{color:var(--muted);font-size:.88rem;margin-top:2px}
.entry .n{font-family:var(--display);font-weight:800;color:var(--rose);font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:14px 6px;border-radius:18px;background:var(--surface-2);transition:transform .2s}
.badge .ic{font-size:2rem;line-height:1;filter:grayscale(1) opacity(.35)}
.badge b{display:block;font-size:.78rem;margin-top:6px;line-height:1.2}
.badge small{display:block;color:var(--muted);font-size:.7rem;margin-top:2px}
.badge.on{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 22%,var(--surface)),var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--gold) 55%,transparent)}
.badge.on .ic{filter:none;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}

/* Carte du corps */
.body-map{width:100%;max-width:290px;margin:4px auto;display:block}
.body-map .sil{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.body-map .zone{fill:color-mix(in srgb,var(--rose) 14%,transparent);stroke:var(--rose);stroke-width:1.5;stroke-dasharray:4 3;cursor:pointer;transition:fill .2s,transform .2s;transform-box:fill-box;transform-origin:center}
.body-map .zone.sug{fill:color-mix(in srgb,var(--mint) 22%,transparent);stroke:var(--mint);stroke-dasharray:none;animation:breathe 1.8s ease-in-out infinite}
.body-map .zone.last{fill:color-mix(in srgb,var(--muted) 18%,transparent);stroke:var(--muted)}
.body-map .zone.sel{fill:var(--rose);stroke:var(--rose);stroke-dasharray:none;animation:none}
.body-map text{font:800 8px var(--font);fill:var(--muted);text-anchor:middle;pointer-events:none}
.body-map .heat{pointer-events:none}
@keyframes breathe{50%{transform:scale(1.1)}}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:.8rem;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* Barre d'onglets */
.tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:min(520px,calc(100% - 24px));height:var(--tab-h);display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:800;color:var(--muted);position:relative}
.tabbar svg{width:24px;height:24px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tabbar button.on{color:var(--rose)}
.tabbar button.on svg{transform:translateY(-2px) scale(1.12)}
.tabbar button.on::after{content:"";position:absolute;bottom:7px;width:5px;height:5px;border-radius:50%;background:var(--rose)}

/* Formulaires */
label.f{display:block;font-weight:800;font-size:.85rem;margin:14px 2px 6px}
.in{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--rose);box-shadow:0 0 0 4px color-mix(in srgb,var(--rose) 18%,transparent)}
textarea.in{min-height:90px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;min-height:44px;padding:8px 12px;border-radius:14px;background:var(--surface-2);border:1.5px solid transparent;font-weight:800;font-size:.9rem;transition:all .2s}
.seg button.on{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,var(--surface));color:var(--rose)}
.emo{display:flex;justify-content:space-between;gap:6px}
.emo button{flex:1;font-size:1.7rem;min-height:56px;border-radius:16px;background:var(--surface-2);border:1.5px solid transparent;transition:transform .2s}
.emo button.on{border-color:var(--rose);transform:scale(1.08);background:color-mix(in srgb,var(--rose) 12%,var(--surface))}
.emo-l{display:flex;justify-content:space-between;color:var(--muted);font-size:.72rem;font-weight:700;margin-top:4px}
.msg{margin-top:12px;font-weight:700;font-size:.9rem;min-height:1em}
.msg.err{color:var(--warn)}.msg.ok{color:var(--mint)}

/* Feuille modale & parcours */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(24,12,30,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);max-width:560px;margin:0 auto;animation:up .42s cubic-bezier(.2,.9,.2,1);overscroll-behavior:contain}
.sheet.full{top:0;max-height:none;border-radius:0;padding-top:calc(env(safe-area-inset-top) + 10px)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.x{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:1.2rem;font-weight:800}
.steps{display:flex;gap:6px;margin:6px 0 18px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.steps i.on::after{content:"";position:absolute;inset:0;background:var(--grad);animation:fill .5s ease forwards;transform-origin:left}
@keyframes fill{from{transform:scaleX(0)}}
.step{animation:viewIn .4s cubic-bezier(.2,.8,.2,1)}
.sheet.still .step,.sheet.still .steps i.on::after,.sheet.still .celebrate *{animation:none}
.step h2{font-size:1.6rem;margin-bottom:6px}
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;font-weight:700;transition:all .2s}
.check .box{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.check.on{border-color:color-mix(in srgb,var(--mint) 50%,transparent);background:var(--mint-soft)}
.check.on .box{background:var(--mint);border-color:var(--mint);transform:rotate(-8deg) scale(1.05)}
.check .box svg{width:16px;height:16px;stroke:#fff;stroke-width:3.5;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .05s}
.check.on .box svg{stroke-dashoffset:0}
.check small{display:block;color:var(--muted);font-weight:600;font-size:.82rem}
.breath{width:210px;height:210px;margin:20px auto;position:relative;display:grid;place-items:center}
.breath .c{position:absolute;inset:0;border-radius:50%;background:var(--grad);opacity:.85;transform:scale(.55);animation:breath 16s ease-in-out infinite}
.breath .c2{position:absolute;inset:-14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--rose) 35%,transparent);transform:scale(.6);animation:breath 16s ease-in-out infinite;animation-delay:.15s}
.breath span{position:relative;color:#fff;font-weight:800;font-size:1.2rem;text-shadow:0 1px 6px rgba(0,0,0,.2)}
@keyframes breath{0%,100%{transform:scale(.55)}25%,50%{transform:scale(1)}75%{transform:scale(.55)}}
.timer{font-family:var(--display);font-size:5rem;font-weight:800;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;margin:18px 0 6px}
.note{font-size:.85rem;color:var(--muted);background:var(--surface-2);border-radius:14px;padding:10px 12px;margin-top:12px}

/* Célébration */
.celebrate{text-align:center;padding-top:30px}
.celebrate .shield{width:170px;height:170px;margin:0 auto;animation:shieldIn 1s cubic-bezier(.3,1.5,.5,1)}
@keyframes shieldIn{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.celebrate h2{font-size:2.3rem;margin-top:14px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.celebrate p{font-size:1.05rem;max-width:340px;margin:8px auto}
.newbadge{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:10px 16px;border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 25%,var(--surface)),var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--gold) 55%,transparent);font-weight:800;animation:pop .7s .6s cubic-bezier(.3,1.6,.5,1) both}
#confetti{position:fixed;inset:0;z-index:60;pointer-events:none}

/* Connexion */
.auth{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center}
.logo{width:96px;height:96px;margin:0 auto 14px;animation:floaty 4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px) rotate(2deg)}}
.auth h1{text-align:center;font-size:2.4rem}
.auth .tag{text-align:center;color:var(--muted);margin:6px 0 22px;font-weight:600}
.tabs{display:flex;background:var(--surface-2);border-radius:16px;padding:4px;gap:4px}
.tabs button{flex:1;min-height:42px;border-radius:12px;font-weight:800;color:var(--muted);transition:all .25s}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.link{color:var(--rose);font-weight:800;font-size:.9rem;margin-top:14px;display:block;text-align:center;width:100%}

.toast{position:fixed;z-index:70;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:800;font-size:.92rem;box-shadow:var(--shadow);transition:transform .45s cubic-bezier(.3,1.4,.5,1);max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0)}
.skel{height:220px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.spark{width:100%;height:70px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .ic{font-size:2.6rem}
.sos{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--warn-soft);color:var(--warn);font-weight:800;text-decoration:none;font-size:.9rem}
a.btn{text-decoration:none}
.grid2+.card{margin-top:14px}
.stepper{flex:none;display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:16px;padding:4px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--surface);font-size:1.35rem;font-weight:800;box-shadow:var(--shadow);transition:transform .15s}
.stepper button:active{transform:scale(.88)}
.stepper b{min-width:32px;text-align:center;font-family:var(--display);font-size:1.45rem;display:inline-block}
.pens.low{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:linear-gradient(160deg,var(--warn-soft),var(--surface) 70%)}
.pens.low .muted{color:var(--warn);font-weight:700}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
